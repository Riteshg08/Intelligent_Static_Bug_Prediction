[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-static-bug-prediction"
version = "0.1.0"
description = "Intelligent Static Bug Prediction System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tree-sitter>=0.21.0",
    "lizard>=1.17.10",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.11.0",
    "psycopg2-binary>=2.9.0",
    "redis>=5.0.0",
    "rq>=1.15.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0"
]

[tool.setuptools]
packages = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 100
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "venv",
    ".venv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
